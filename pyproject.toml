[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "phocinae-mcp"
version = "0.1.1"
description = "斑海豹 Phocinae MCP stdio server：命令审批 gate + classify/route/score 推理工具（纯标准库）"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [{name = "phocinae project"}]
keywords = ["mcp", "model-context-protocol", "command-guard", "claude-code", "cline", "zed"]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
]

[project.scripts]
phocinae-mcp = "phocinae_mcp.server:main"

[tool.setuptools.packages.find]
include = ["phocinae_mcp*"]
