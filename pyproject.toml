[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "phocinae-mcp"
version = "0.2.1"
description = "斑海豹 MCP server（gate/classify/route/score；stdio + Streamable HTTP；MCP 2026-07-28 对齐 + 2024-11-05 兼容）—— 本地增强版，不发布"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "phocinae-eco (local enhanced fork)" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Software Development :: Libraries",
]

[project.scripts]
phocinae-mcp = "phocinae_mcp.server:main"

[tool.setuptools]
packages = ["phocinae_mcp"]
